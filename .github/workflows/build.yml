name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxcb-cursor0 zip

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: ''
          cache: true

      - name: Build and package
        run: packaging/package-linux.sh "$QT_ROOT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: qMdict-linux-x86_64
          path: dist/*.zip

  # Built on 24.04 rather than alongside the zip on 22.04: the package links the
  # distribution's Qt instead of bundling one, and 24.04 renamed those packages
  # to libqt6core6t64 and friends, so one built on 22.04 will not install there.
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev

      - name: Build and package
        run: packaging/package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qMdict-linux-deb
          path: dist/*.deb

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Build and package
        shell: pwsh
        run: packaging\package-windows.ps1 -QtPrefix "$env:QT_ROOT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: qMdict-windows-x86_64
          path: dist/*.zip

  release:
    needs: [linux, deb, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
          generate_release_notes: true
